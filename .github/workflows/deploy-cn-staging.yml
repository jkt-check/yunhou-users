name: deploy-cn-staging
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

# Inlined the build + bump jobs that used to be reusable calls into
# jkt-check/yunhou-deploy/.github/workflows/reusable-build-go.yml and
# reusable-bump-manifest.yml. The two reusable runs (29895867556, 29895864198,
# 29903280258, 29903275238) all failed with 0 jobs / 0 seconds and a
# 'workflow was not found' error from the dispatch path — the yunhou-deploy
# reusable workflows live in a private repo (access_level: user), and the
# yunhou-users repo's selected-action whitelist (docker/*, jkt-check/*)
# resolves the call at parse time but the cross-repo resolution fails at
# dispatch. Inlining keeps the same call contract; the bump job still
# pushes the digest into jkt-check/yunhou-deploy/deploy/cn-staging.digests
# via ${{ secrets.DEPLOY_BOT_PAT }} / BUMP_APP_ID.

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-cn-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./cmd/... ./internal/...
      - name: unit test
        run: go test -race ./cmd/... ./internal/util/... ./internal/billing/... ./internal/middleware/... ./internal/handler/... ./internal/model/... ./internal/router/...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yunhou-users:${{ github.sha }}

  bump:
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.BUMP_APP_ID != '' }}
    steps:
      - id: app-token
        if: ${{ env.HAS_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: yunhou-deploy
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/yunhou-deploy
          token: ${{ steps.app-token.outputs.token || secrets.DEPLOY_BOT_PAT }}
          ref: main
      - name: validate caller and write digest
        env:
          CALLER: ${{ github.repository }}
          SERVICE: users
          DIGEST: ${{ needs.build.outputs.digest }}
          STAGE: cn-staging
        run: |
          set -euo pipefail
          bin/manifest.sh assert-repo-service "$CALLER" "$SERVICE"
          KEY="$(bin/manifest.sh key-for-service "$SERVICE")"
          bin/manifest.sh set "deploy/${STAGE}.digests" "$KEY" "$DIGEST"
      - name: commit with fetch+rebase+retry
        env:
          STAGE: cn-staging
          SERVICE: users
        run: |
          set -euo pipefail
          git config user.name "yunhou-deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add "deploy/${STAGE}.digests"
          if git diff --cached --quiet; then echo "no change (idempotent digest)"; exit 0; fi
          git commit -m "chore(${STAGE}): bump ${SERVICE} digest"
          for i in 1 2 3 4 5; do
            if git push origin main; then echo "pushed"; exit 0; fi
            echo "push rejected, rebase retry $i"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((i))
          done
          echo "push failed after retries" >&2
          exit 1
