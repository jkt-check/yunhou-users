name: deploy-cn-staging
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

# The reusable-build-go.yml needs `packages: write` to push images to
# GHCR, but caller workflows must also declare the permissions they grant
# to the reusable — GitHub's permission model is the union, with the
# most-restrictive default (no declaration → read-only). Declaring
# `packages: write` here gives the reusable the access it asks for;
# the `contents: read` is the default for code checkout.
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-cn-staging
  cancel-in-progress: false

jobs:
  build:
    # SHA-pinned to yunhou-deploy main HEAD (20893fc, 2026-07-22) so the
    # build-paths + test-paths inputs below are accepted by the reusable.
    # Bumped from fc2927d (2026-07-16) — the prior pin produced
    # "workflow was not found" on the dispatch path in run 29895867556,
    # so any later pin in the same repo is fine as long as the call site
    # ships the matching `with:` contract.
    uses: jkt-check/yunhou-deploy/.github/workflows/reusable-build-go.yml@20893fca4e57a5de3c78b77deb9fc51fd6c2cf26
    with:
      image-name: yunhou-users
      # build 全 internal/cmd — image 实际包含的代码必须保证编译过。
      build-paths: './cmd/... ./internal/...'
      # test 收窄到不需要 PG/Redis 的子集 — service / repo / config / migrate
      # 直接或间接连 PG（service → repo），CI runner 无 PG 时会 panic。
      # tests/e2e + tests/integration 同理。PG-needing 测试留给本地
      # (make test) + staging post-deploy smoke（v3 任务，未做）。
      test-paths:  './cmd/... ./internal/util/... ./internal/billing/... ./internal/middleware/... ./internal/handler/... ./internal/model/... ./internal/router/...'

  bump:
    needs: build
    uses: jkt-check/yunhou-deploy/.github/workflows/reusable-bump-manifest.yml@20893fca4e57a5de3c78b77deb9fc51fd6c2cf26
    with:
      service: users
      digest: ${{ needs.build.outputs.digest }}
    secrets:
      # app-id defaults to '' so HAS_APP in the reusable flips to false
      # and the App-token step (`actions/create-github-app-token@v1` which
      # fails to parse PKCS#8 PEMs on Node 24) is skipped entirely, leaving
      # the PAT as the credential for the reusable's actions/checkout@v4
      # token. When BUMP_APP_ID *is* set, the workflow runs the App-token
      # path normally.
      app-id:   ${{ secrets.BUMP_APP_ID || '' }}
      app-key:  ${{ secrets.BUMP_APP_PRIVATE_KEY }}
      bump-pat: ${{ secrets.DEPLOY_BOT_PAT }}
