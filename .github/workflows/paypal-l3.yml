# L3 PayPal sandbox UI integration suite.
#
# NOT a default PR gate — runs nightly + on demand. Trigger via the
# Actions tab (workflow_dispatch) or as the nightlies schedule.
#
# Required secrets (configure per-repo):
#   PAYPAL_SANDBOX_CLIENT_ID       - sandbox REST app client id
#   PAYPAL_SANDBOX_SECRET          - sandbox REST app secret
#   PAYPAL_SANDBOX_WEBHOOK_ID      - registered webhook id
#   PAYPAL_BUYER_ACCOUNT_EMAIL     - sandbox personal buyer
#   PAYPAL_BUYER_ACCOUNT_PASSWORD  - sandbox personal buyer
#   PAYPAL_TEST_PLAN_ID            - pre-created Plan id (P-xxx)
#
# Required repo variables:
#   PAYPAL_NGROK_AUTHTOKEN         - ngrok authtoken

name: paypal-l3-sandbox

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'   # nightly 07:00 UTC

jobs:
  paypal-l3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (for backend)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tests/e2e-ui/package-lock.json'

      - name: Start Postgres
        run: |
          sudo service postgresql start
          sudo -u postgres createdb yunhou_users_e2e
          sudo -u postgres psql -d yunhou_users_e2e -f migrations/001_init.sql
          sudo -u postgres psql -d yunhou_users_e2e -f migrations/002_simplify_plans.sql
          sudo -u postgres psql -d yunhou_users_e2e -f migrations/003_payments.sql
          sudo -u postgres psql -d yunhou_users_e2e -f migrations/004_ls_channel.sql
          sudo -u postgres psql -d yunhou_users_e2e -f migrations/005_paypal_channel.sql
          sudo -u postgres psql -d yunhou_users_e2e -f migrations/006_paypal_sub_mapping.sql

      - name: Start ngrok
        env:
          NGROK_AUTHTOKEN: ${{ vars.PAYPAL_NGROK_AUTHTOKEN }}
          NGROK_ROOT: /tmp
        run: |
          curl -sSL https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.tgz | tar xz -C /tmp/
          /tmp/ngrok authtoken "$NGROK_AUTHTOKEN"
          /tmp/ngrok http 8080 --log /tmp/ngrok.log &
          sleep 5
          curl -s http://127.0.0.1:4040/api/tunnels | jq '.tunnels[0].public_url' > /tmp/ngrok-url
          cat /tmp/ngrok-url

      - name: Start backend
        env:
          DATABASE_URL: postgres://postgres@localhost/yunhou_users_e2e?sslmode=disable
          PAYPAL_ENV: sandbox
          PAYPAL_WEBHOOK_ID_SANDBOX: ${{ secrets.PAYPAL_SANDBOX_WEBHOOK_ID }}
          PAYPAL_API_BASE_SANDBOX: https://api-m.sandbox.paypal.com
        run: |
          go build -o /tmp/yunhou-server ./cmd/server
          DATABASE_URL=$DATABASE_URL \
            PAYPAL_ENV=$PAYPAL_ENV \
            PAYPAL_WEBHOOK_ID_SANDBOX=$PAYPAL_WEBHOOK_ID_SANDBOX \
            PAYPAL_API_BASE_SANDBOX=$PAYPAL_API_BASE_SANDBOX \
            /tmp/yunhou-server &

      - name: Install Playwright
        working-directory: tests/e2e-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run L3 PayPal tests
        working-directory: tests/e2e-ui
        env:
          PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_SANDBOX_SECRET: ${{ secrets.PAYPAL_SANDBOX_SECRET }}
          PAYPAL_SANDBOX_WEBHOOK_ID: ${{ secrets.PAYPAL_SANDBOX_WEBHOOK_ID }}
          PAYPAL_BUYER_ACCOUNT_EMAIL: ${{ secrets.PAYPAL_BUYER_ACCOUNT_EMAIL }}
          PAYPAL_BUYER_ACCOUNT_PASSWORD: ${{ secrets.PAYPAL_BUYER_ACCOUNT_PASSWORD }}
          PAYPAL_TEST_PLAN_ID: ${{ secrets.PAYPAL_TEST_PLAN_ID }}
          E2E_DATABASE_URL: postgres://postgres@localhost/yunhou_users_e2e?sslmode=disable
          BACKEND_URL: http://localhost:8080
          WEBHOOK_BASE_URL: $(cat /tmp/ngrok-url | tr -d '"')
        run: npm run all

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e-ui/playwright-report/

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: tests/e2e-ui/test-results/
