name: pr-ci
on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'

# Inlined the call to jkt-check/yunhou-deploy/.github/workflows/reusable-pr-ci-go.yml
# for the same reason as deploy-cn-staging.yml: the cross-repo dispatch
# failed with 0 jobs / 0 seconds ("workflow was not found") because
# yunhou-deploy is private and its access_level is "user", which the
# yunhou-users selected-action whitelist cannot resolve. Inlining keeps
# the same call contract.

permissions:
  contents: read

jobs:
  go-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: lint (vet)
        # Folded scalar (`>`) so YAML collapses the newlines into spaces —
        # `|` would pass literal newlines to the shell and break the
        # `go vet/build/test` invocation into multiple commands.
        run: go vet ./internal/billing/... ./internal/handler/... ./internal/middleware/... ./internal/model/... ./internal/router/... ./internal/util/...
      - name: build
        run: go build ./internal/billing/... ./internal/handler/... ./internal/middleware/... ./internal/model/... ./internal/router/... ./internal/util/...
      - name: unit test
        run: go test -race ./internal/billing/... ./internal/handler/... ./internal/middleware/... ./internal/model/... ./internal/router/... ./internal/util/...
