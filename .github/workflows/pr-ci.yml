name: pr-ci
on:
  pull_request:
    branches: [master]

# Inlined the call to jkt-check/yunhou-deploy/.github/workflows/reusable-pr-ci-go.yml
# for the same reason as deploy-cn-staging.yml: the cross-repo dispatch
# failed with 0 jobs / 0 seconds ("workflow was not found") because
# yunhou-deploy is private and its access_level is "user", which the
# yunhou-users selected-action whitelist cannot resolve. Inlining keeps
# the same call contract.

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: lint (vet)
        # Folded scalar (`>`) so YAML collapses the newlines into spaces —
        # `|` would pass literal newlines to the shell and break the
        # `go vet/build/test` invocation into multiple commands.
        run: go vet ./internal/... ./cmd/...
      - name: build
        run: go build ./...
      - name: unit test
        run: go test -race ./internal/... ./cmd/...
