# Yunhou Users — Nginx config (no-domain form).
# Drop into /etc/nginx/sites-available/yunhou-users and symlink into sites-enabled.
# When a real domain is added, see docs/deployment.md §"Domain upgrade".

http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Pre-domain: serve the API over plain HTTP on port 80.
    server {
        listen 80 default_server;
        server_name _;

        # Security headers — useful even on the plain-HTTP pre-domain form.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"   always;
        add_header Referrer-Policy        "no-referrer" always;

        # Cap request body size to defend against accidental huge payloads
        # (the API only accepts small JSON, never uploads). /chat overrides
        # this below — its legal payloads are larger.
        client_max_body_size 64k;

        location / {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 25s;
        }

        # /chat relays an upstream SSE stream that can legitimately run for
        # minutes (the Go side allows 5m upstream + 6m write deadline). The
        # generic 25s proxy_read_timeout would kill a long "thinking" pause,
        # and default proxy_buffering would batch the chunks. The app also
        # sends X-Accel-Buffering: no; proxy_buffering off here is the
        # belt-and-suspenders half.
        location = /chat {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 360s;
            # /chat payloads (messages ≤256 KiB + tools ≤32 KiB + JSON
            # overhead ≈ 290 KiB) legitimately exceed the global 64k cap; the
            # Go handler caps the body at 320 KiB, so allow that plus margin
            # (384k) and let over-limit requests reach the handler's 400 JSON
            # instead of nginx answering 413.
            client_max_body_size 384k;
        }
    }

    # Post-domain: uncomment and set server_name to the real domain.
    # Requires running `sudo certbot --nginx -d <domain>` first.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name api.yh.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/api.yh.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/api.yh.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-Frame-Options        "DENY"   always;
    #     add_header Referrer-Policy        "no-referrer" always;
    #
    #     location / {
    #         limit_req zone=api burst=60 nodelay;
    #         proxy_pass http://127.0.0.1:8080;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 25s;
    #     }
    #
    #     # /chat needs the same SSE treatment as the port-80 server above —
    #     # copy the `location = /chat` block (proxy_buffering off,
    #     # proxy_read_timeout 360s) when enabling this server.
    # }
}
