/var/lib/docker/containers/*/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# Chat access audit log (CHAT_LOG_PATH) — holds truncated conversation
# content (PII; the app opens it 0o600 and keeps the fd for the process
# lifetime, hence copytruncate). Enabled by default since the 2026-10
# security audit: without rotation the file grows unbounded.
/var/log/yunhou/chat-access.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
