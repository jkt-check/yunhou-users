/var/lib/docker/containers/*/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# Chat access audit log (CHAT_LOG_PATH) — holds full conversation content
# (PII; the app opens it 0o600 and keeps the fd for the process lifetime,
# hence copytruncate). Uncomment and point at the host path when
# CHAT_LOG_PATH is bind-mounted out of the container.
# /var/log/yunhou/chat-access.log {
#     daily
#     rotate 30
#     compress
#     delaycompress
#     missingok
#     notifempty
#     copytruncate
# }
